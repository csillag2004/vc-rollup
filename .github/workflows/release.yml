# On a published release: build the runtime image, check it with the smoke reproduction, then push
# it to the GitHub Container Registry under the release tag, so the Zenodo version and the image
# match. Zenodo archives the release itself.
name: release
on:
  release: { types: [published] }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Build
        run: >-
          docker build
          --build-arg ARTIFACT_REVISION="$GITHUB_SHA"
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --label org.opencontainers.image.version="${{ github.event.release.tag_name }}"
          -t "$IMAGE" .
      - name: Smoke reproduction
        run: docker run --rm "$IMAGE" reproduce --smoke
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push
        run: docker push "$IMAGE"
