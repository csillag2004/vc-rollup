[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["ethr-did-registry/=lib/ethr-did-registry/contracts/"]

[rpc_endpoints]
scroll_sepolia = "https://sepolia-rpc.scroll.io"

[etherscan]
scroll_sepolia = { key = "${SCROLLSCAN_API_KEY}", url = "https://api-sepolia.scrollscan.com/api", chain = 534351 }

