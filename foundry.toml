[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["ethr-did-registry/=lib/ethr-did-registry/contracts/"]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
op_sepolia = "https://sepolia.optimism.io"

[etherscan]
op_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }
